name: Generate sitemap.xml

on:
  push:
    branches: [ main ]   # <-- Change if bradlumley.com builds from another branch

permissions:
  contents: write        # allows pushing the updated sitemap

jobs:
  sitemap_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for accurate <lastmod> based on git history

      - name: Generate sitemap
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://bradlumley.com/
          # If your site lives in /docs or another folder, uncomment and set:
          # path-to-root: docs

      - name: Commit updated sitemap
        run: |
          set -e

          sitemap_path="${{ steps.sitemap.outputs.sitemap-path }}"
          echo "Sitemap generated at: $sitemap_path"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$sitemap_path"

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to $sitemap_path"
            exit 0
          fi

          git commit -m "Update sitemap [skip ci]"
          git push
